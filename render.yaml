# Render blueprint for the CodeBot API.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repository.
# The two secrets marked `sync: false` are entered in the Render dashboard and
# never stored in this file.
services:
  - type: web
    name: codebot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: codebot
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Generated once by Render and kept secret.
      - key: JWT_SECRET
        generateValue: true
      # Filled in from the Render dashboard.
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # The deployed frontend origin, for example https://codebot.vercel.app
      - key: CORS_ORIGINS
        sync: false
